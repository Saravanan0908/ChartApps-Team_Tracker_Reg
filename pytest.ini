[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --browser chromium --alluredir=reports/allure-results --junitxml=reports/junit_report.xml
markers =
    regression: mark test as part of the complete regression suite (runs both scenarios)
    existing_app: mark test to run only the existing app (Team Tracker) scenario
    new_app: mark test to run only the new app creation and workflow scenario
