[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --browser chromium --html=reports/azure_test_report.html --self-contained-html --alluredir=reports/allure-results --junitxml=reports/junit_report.xml
markers =
    regression: mark test as part of the regression test suite (Team Tracker - matches 4d83904)
    existing_app: mark test to run existing app (Team Tracker) scenario
    new_app: mark test to run new app creation and workflow scenario
