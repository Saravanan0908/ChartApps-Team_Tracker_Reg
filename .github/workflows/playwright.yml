name: Playwright Regression CI/CD

run-name: ChartApps Regression - ${{ github.event_name }} - Run ${{ github.run_number }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # 11:00 AM IST
    - cron: '30 5 * * *'

    # 5:00 PM IST
    - cron: '30 11 * * *'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:

    name: Run Playwright Regression Suite

    runs-on: windows-latest

    timeout-minutes: 45

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Display Trigger Information
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BRANCH: ${{ github.ref_name }}
        run: |
          Write-Host "Event: $env:EVENT_NAME"
          Write-Host "Schedule: $env:SCHEDULE"
          Write-Host "Branch: $env:BRANCH"
          Write-Host "UTC Time: $([DateTime]::UtcNow)"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install chromium

      - name: Create Report Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "reports" | Out-Null
          New-Item -ItemType Directory -Force -Path "reports/screenshots" | Out-Null

      - name: Restore Authentication Session
        shell: pwsh
        env:
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          New-Item -ItemType Directory -Force -Path ".auth_profile" | Out-Null

          if ($env:AUTH_STORAGE_STATE -and $env:AUTH_STORAGE_STATE.Trim() -ne "") {
            Set-Content -Path ".auth_profile/storage_state.json" -Value $env:AUTH_STORAGE_STATE -Encoding utf8
            Write-Host "Authentication session restored."
          } else {
            Write-Host "No saved session. Fallback login will be used."
          }

      - name: Execute Regression Tests
        shell: pwsh
        env:
          CHARTAPPS_EMAIL: ${{ secrets.CHARTAPPS_EMAIL }}
          CHARTAPPS_PASSWORD: ${{ secrets.CHARTAPPS_PASSWORD }}
          CI: "true"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python -m pytest -m regression -s -v `
            --html=reports/azure_test_report.html `
            --self-contained-html `
            --junitxml=reports/junit_report.xml

      - name: Publish Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChartApps-Test-Reports
          path: |
            reports/azure_test_report.html
            reports/junit_report.xml
            reports/screenshots/
          if-no-files-found: warn
          retention-days: 14

      - name: Send Email Notification
        if: always()
        shell: pwsh
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'saravanans@objectways.com' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          JOB_STATUS: ${{ job.status }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python utils/email_notifier.py
