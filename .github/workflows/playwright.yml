name: Playwright Regression CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # 1. Custom test run: Today only (Nov 19) at 12:00 PM IST (06:30 UTC)
    - cron: '30 6 19 11 *'
    # 2. Daily recurring run: Every day at 11:00 AM IST (05:30 UTC)
    - cron: '30 5 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  regression-tests:
    name: Run Playwright Regression Suite
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Check & Restore Auth Session State
        shell: pwsh
        env:
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          New-Item -ItemType Directory -Force -Path ".auth_profile" | Out-Null
          if ($env:AUTH_STORAGE_STATE -and $env:AUTH_STORAGE_STATE.Trim() -ne "") {
            $env:AUTH_STORAGE_STATE | Out-File -FilePath ".auth_profile/storage_state.json" -Encoding utf8
            Write-Host "SUCCESS: Restored authentication storage state from GitHub Secrets."
          } else {
            Write-Host "NOTICE: Running with automated fallback credentials."
          }

      - name: Execute Regression Tests
        shell: pwsh
        env:
          CHARTAPPS_EMAIL: ${{ secrets.CHARTAPPS_EMAIL }}
          CHARTAPPS_PASSWORD: ${{ secrets.CHARTAPPS_PASSWORD }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          pytest -m regression -s -v --html=reports/azure_test_report.html --self-contained-html --junitxml=reports/junit_report.xml

      - name: Publish Test Report & Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Execution-Reports
          path: |
            reports/azure_test_report.html
            reports/junit_report.xml
            reports/screenshots/
          retention-days: 14

      - name: Send Email Notification (Pass/Fail Status & Screenshot)
        if: always()
        shell: pwsh
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python utils/email_notifier.py
