name: Playwright Regression CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  regression-tests:
    name: Run Playwright Regression Suite
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Check & Restore Auth Session State
        shell: pwsh
        env:
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          if ($env:AUTH_STORAGE_STATE -and $env:AUTH_STORAGE_STATE.Trim() -ne "") {
            New-Item -ItemType Directory -Force -Path ".auth_profile" | Out-Null
            $env:AUTH_STORAGE_STATE | Out-File -FilePath ".auth_profile/storage_state.json" -Encoding utf8
            Write-Host "SUCCESS: Restored authentication storage state from GitHub Secrets."
          } else {
            Write-Warning "NOTICE: Secret 'AUTH_STORAGE_STATE' is not set in GitHub repository settings. Tests requiring authentication will redirect to /dashboard/auth."
          }

      - name: Execute Regression Tests
        shell: pwsh
        run: |
          pytest -m regression --html=reports/azure_test_report.html --self-contained-html --junitxml=reports/junit_report.xml

      - name: Publish Test Report & Failure Screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Execution-Reports
          path: |
            reports/azure_test_report.html
            reports/junit_report.xml
            reports/screenshots/
          retention-days: 14
