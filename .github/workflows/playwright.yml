
name: Playwright Regression CI/CD

run-name: ChartApps Regression - ${{ github.event_name }} - Run ${{ github.run_number }}

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:

    # Daily at 6:00 PM IST (12:30 UTC)
    - cron: '30 12 * * *'

  workflow_dispatch:
    inputs:
      scenario:
        description: 'Select Scenario to Run (all = both in order, existing_app = Team Tracker only, new_app = New App only)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - existing_app
          - new_app

permissions:
  contents: read

concurrency:
  group: chartapps-playwright-regression
  cancel-in-progress: false

jobs:
  regression-tests:

    name: Run Playwright Regression Suite

    runs-on: windows-latest

    timeout-minutes: 45

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # 3. Display trigger information
      - name: Display Trigger Information
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          BRANCH: ${{ github.ref_name }}
        run: |
          Write-Host "===================================="
          Write-Host "ChartApps Playwright Automation"
          Write-Host "===================================="
          Write-Host "Event: $env:EVENT_NAME"
          Write-Host "Schedule: $env:SCHEDULE"
          Write-Host "Branch: $env:BRANCH"
          Write-Host "UTC Time: $([DateTime]::UtcNow)"
          Write-Host "===================================="

      # 4. Install Python dependencies
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Install Playwright Browsers (Chromium & Chrome)
      - name: Install Playwright Browsers
        run: |
          python -m playwright install chromium
          python -m playwright install chrome

      # 6. Create report directories
      - name: Create Report Directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "reports" | Out-Null
          New-Item -ItemType Directory -Force -Path "reports/screenshots" | Out-Null

      # 7. Restore authentication session
      - name: Restore Authentication Session
        shell: pwsh
        env:
          AUTH_STORAGE_STATE: ${{ secrets.AUTH_STORAGE_STATE }}
        run: |
          New-Item -ItemType Directory -Force -Path ".auth_profile" | Out-Null
          $targetFile = ".auth_profile/storage_state.json"

          if ($env:AUTH_STORAGE_STATE -and $env:AUTH_STORAGE_STATE.Trim() -ne "") {
            $raw = $env:AUTH_STORAGE_STATE.Trim()
            $content = $null

            # Detect Base64 vs Raw JSON
            if ($raw.StartsWith("{")) {
              $content = $raw
              Write-Host "Detected raw JSON session."
            } else {
              try {
                $bytes = [System.Convert]::FromBase64String($raw)
                $content = [System.Text.Encoding]::UTF8.GetString($bytes)
                Write-Host "Detected Base64-encoded session. Successfully decoded."
              } catch {
                $content = $raw
                Write-Host "Could not decode Base64, treating as raw string."
              }
            }

            Set-Content -Path $targetFile -Value $content -Encoding utf8

            # Validate restored JSON
            try {
              $json = Get-Content $targetFile -Raw | ConvertFrom-Json
              $cookieCount = ($json.cookies | Measure-Object).Count
              $googleCount = ($json.cookies | Where-Object { $_.domain -like "*google*" } | Measure-Object).Count
              Write-Host "SUCCESS: Authentication session restored! Total cookies: $cookieCount ($googleCount Google cookies)."
            } catch {
              Write-Host "WARNING: Restored file could not be parsed as JSON: $_"
            }
          } elseif (Test-Path "testdata/auth_session.json") {
            Copy-Item "testdata/auth_session.json" -Destination $targetFile -Force
            Write-Host "SUCCESS: Authentication session restored from repository fallback (testdata/auth_session.json)."
            try {
              $json = Get-Content $targetFile -Raw | ConvertFrom-Json
              $cookieCount = ($json.cookies | Measure-Object).Count
              $googleCount = ($json.cookies | Where-Object { $_.domain -like "*google*" } | Measure-Object).Count
              Write-Host "Validated fallback session: $cookieCount cookies ($googleCount Google cookies) active."
            } catch {
              Write-Host "WARNING: Fallback session could not be parsed: $_"
            }
          } else {
            Write-Host "=================================================================="
            Write-Host "WARNING: No authentication session found (secret or fallback file)!"
            Write-Host "Google OAuth in Scenario 2 will be challenged with 2FA on cloud runners."
            Write-Host "=================================================================="
          }

      # 8. Execute regression tests
      - name: Execute Regression Tests
        shell: pwsh
        env:
          CHARTAPPS_EMAIL: ${{ secrets.CHARTAPPS_EMAIL }}
          CHARTAPPS_PASSWORD: ${{ secrets.CHARTAPPS_PASSWORD }}
          TARGET_SCENARIO: ${{ github.event.inputs.scenario || 'all' }}
          CI: "true"
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          $marker = "regression"
          if ($env:TARGET_SCENARIO -eq "existing_app") { $marker = "existing_app" }
          if ($env:TARGET_SCENARIO -eq "new_app") { $marker = "new_app" }
          Write-Host "Executing Regression Suite with marker: $marker (Target: $env:TARGET_SCENARIO)"
          python -m pytest -m $marker -s -v `
            --alluredir=reports/allure-results `
            --junitxml=reports/junit_report.xml

      # 9. Upload Allure results and screenshots
      - name: Publish Test Reports & Failure Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ChartApps-Test-Reports
          path: |
            reports/allure-results/
            reports/junit_report.xml
            reports/screenshots/
            reports/videos/
          if-no-files-found: warn
          retention-days: 14

      # 10. Send email notification
      - name: Send Email Notification
        if: always()
        shell: pwsh
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO || 'saravanans@objectways.com' }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          JOB_STATUS: ${{ job.status }}
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python utils/email_notifier.py
